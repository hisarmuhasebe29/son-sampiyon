<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Son Şampiyon">
<title>Son Şampiyon — ARAÇ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden}
  #wrap{position:absolute;inset:0}
  #wrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #g3,#bgc{background:transparent;display:none}
  #c{background:transparent}
  #ui{position:absolute;inset:0;pointer-events:none;display:none}
  #joy{position:absolute;left:3vmin;bottom:3vmin;width:36vmin;height:36vmin;border-radius:50%;pointer-events:auto;touch-action:none;
    background:radial-gradient(circle,rgba(255,255,255,.10) 0%,rgba(255,255,255,.04) 60%,rgba(255,255,255,.12) 100%);border:2px solid rgba(255,255,255,.35);box-sizing:border-box}
  #joy.on{border-color:#f2c230}
  #joy .ar{position:absolute;color:rgba(255,255,255,.55);font:bold 4.5vmin system-ui,sans-serif}
  #knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d0,#f2c230 60%,#a87400);
    box-shadow:0 0 2vmin rgba(0,0,0,.5);transition:transform .05s}
  .btn{position:absolute;pointer-events:auto;width:16vmin;height:16vmin;border-radius:50%;display:none;
    background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35);color:#fff;
    font:bold 7vmin system-ui,sans-serif;align-items:center;justify-content:center;box-sizing:border-box;touch-action:none}
  .btn{flex-direction:column}
  .btn b{font-weight:normal;line-height:1;display:flex}
  .btn .ic{width:55%;height:55%}
  .btn b .ic{width:1.25em;height:1.25em}
  .btn i{font-style:normal;font:900 2.3vmin system-ui,sans-serif;letter-spacing:.02em;color:#fff;margin-top:.6vmin;text-shadow:0 1px 2px #000}
  .btn.on{background:rgba(242,194,48,.5);border-color:#f2c230;transform:scale(.94)}
  .btn.ready{border-color:#fff176;box-shadow:0 0 3vmin #f2c230;animation:pulse .6s infinite alternate}
  .btn.cd{background:conic-gradient(rgba(242,194,48,.62) calc(var(--cd) * 1turn), rgba(10,14,30,.6) 0);border-color:rgba(255,255,255,.2);filter:saturate(.7)}
  .btn.ready1{box-shadow:0 0 4vmin #f2c230;border-color:#fff176}
  @keyframes pulse{from{background:rgba(242,194,48,.25)}to{background:rgba(242,194,48,.7)}}
  #rotate{position:fixed;inset:0;background:#0b1020;color:#f2c230;display:none;flex-direction:column;
    align-items:center;justify-content:center;font:bold 6vmin system-ui,sans-serif;text-align:center;z-index:9}
  #rotate span{font-size:18vmin;margin-bottom:4vmin}
</style>
</head>
<body>
<div id="app"><div id="wrap"><canvas id="bgc"></canvas><canvas id="g3"></canvas><canvas id="c"></canvas></div>
<div id="ui">
  <div id="joy"><span class="ar" style="left:42%;top:2%">▲</span><span class="ar" style="left:42%;bottom:2%">▼</span><span class="ar" style="left:4%;top:40%">◀</span><span class="ar" style="right:4%;top:40%">▶</span><div id="knob"></div></div>
  <div class="btn" data-k="punch">👊</div>
  <div class="btn" data-k="kick">🦵</div>
  <div class="btn" data-k="block">🛡️</div>
  <div class="btn" data-k="slide">💨</div>
  <div class="btn" data-k="super">⭐</div>
  <div class="btn" data-k="grab">✋</div>
  <div class="btn" data-k="swap">⇄</div>
  <div class="btn" data-k="shoot">⚽</div>
  <div class="btn" data-k="dash">💨</div>
  <div class="btn" data-k="tackle">🦶</div>
  <div class="btn fb" data-k="pass">➡️</div>
  <div class="btn fb" data-k="thru">⤴️</div>
  <div class="btn fb" data-k="lob">🌙</div>
  <div class="btn" data-k="jump">⬆</div>
</div>
</div>
<div id="rotate"><span><svg viewBox="-1 -1 26 26" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M17 12h.01M8 3a9 9 0 0 1 10 1M18 1v3h-3"/></svg></span>Telefonu yan çevirin</div>
<script>
  window.__boot = function(){ if (window.__booted) return; window.__booted = true;
    const files = ['core', 'art', 'render3d', 'body3d', 'fight', 'fightx', 'match', 'foot3d', 'stadium3d', 'arena3d', 'cut3d', 'fight3d', 'match3d', 'skills3d', 'creator', 'profile', 'mp', 'story', 'game'];
    (function load(i){ if (i >= files.length) return; const s = document.createElement('script'); s.src = files[i] + '.js?v=15'; s.onload = () => load(i + 1); document.body.appendChild(s); })(0); };
  setTimeout(window.__boot, 8000);                     /* 3B kütüphanesi hiç yüklenemezse oyun 2B açılır */
</script>
<script type="module">
  import('./three.module.min.js?v=15').then(T => { window.THREE = T; }).catch(() => {}).finally(() => window.__boot());
</script>
<script nomodule>window.__boot();</script>
</body>
</html>
