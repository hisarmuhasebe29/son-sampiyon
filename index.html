<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Son Şampiyon">
<title>Son Şampiyon — ARAÇ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000}
  #ui{position:fixed;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;pointer-events:auto;width:17vmin;height:17vmin;border-radius:50%;
    background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35);color:#fff;
    font:bold 7vmin system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    box-sizing:border-box;touch-action:none}
  .btn.on{background:rgba(242,194,48,.5);border-color:#f2c230}
  .btn.big{width:19vmin;height:19vmin;font-size:8vmin}
  .btn.small{width:14vmin;height:14vmin;font-size:6vmin}
  #rotate{position:fixed;inset:0;background:#0b1020;color:#f2c230;display:none;flex-direction:column;
    align-items:center;justify-content:center;font:bold 6vmin system-ui,sans-serif;text-align:center;z-index:9}
  #rotate span{font-size:18vmin;margin-bottom:4vmin}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <div class="btn" data-k="left"  style="left:3vmin;bottom:5vmin">◀</div>
  <div class="btn" data-k="right" style="left:23vmin;bottom:5vmin">▶</div>
  <div class="btn" data-k="block" style="right:43vmin;bottom:4vmin">🛡️</div>
  <div class="btn big" data-k="punch" style="right:22vmin;bottom:3vmin">👊</div>
  <div class="btn" data-k="special" style="right:3vmin;bottom:15vmin">⚽</div>
  <div class="btn" data-k="jump"  style="right:23vmin;bottom:24vmin">⤒</div>
  <div class="btn small" data-k="swap" style="right:44vmin;bottom:24vmin">⇄</div>
</div>
<div id="rotate"><span>📱↻</span>Telefonu yan çevirin</div>
<script src="core.js?v=03"></script>
<script src="story.js?v=03"></script>
<script src="game.js?v=03"></script>
</body>
</html>
